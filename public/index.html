<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI ChatBot · AgentCore on AWS</title>
    <meta
      name="description"
      content="An AI ChatBot powered by AgentCore, NLP, and AWS (Amazon Bedrock). Speak your question and get a spoken answer."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1>AI ChatBot</h1>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="status-badge" id="statusBadge">Ready</span>
          <span class="llm-tag" id="llmTag" title="Active reasoning engine"></span>
        </div>
      </header>

      <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
        <!-- messages injected here -->
      </main>

      <div class="transcript" id="transcript" aria-hidden="true"></div>

      <footer class="controls">
        <div class="button-row">
          <button
            id="micButton"
            class="mic"
            type="button"
            aria-label="Press and hold or click to speak"
          >
            <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"
              />
              <path
                fill="currentColor"
                d="M19 12a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.08A7 7 0 0 0 19 12Z"
              />
            </svg>
          </button>

          <button
            id="pauseButton"
            class="pause"
            type="button"
            aria-label="Pause the assistant's speech"
            disabled
          >
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
            </svg>
            <span class="pause-label">Pause</span>
          </button>
        </div>

        <form id="textForm" class="text-form" autocomplete="off">
          <input
            id="textInput"
            class="text-input"
            type="text"
            placeholder="…or type your question and press Enter"
            aria-label="Type your question"
          />
          <button type="submit" class="send" aria-label="Send message">Send</button>
        </form>

        <div class="options">
          <label class="toggle">
            <input type="checkbox" id="speakToggle" checked />
            <span>Speak replies</span>
          </label>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
